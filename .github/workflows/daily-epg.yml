name: Daily EPG Update

on:
  schedule:
    # 每天 UTC 18:00 运行 (北京时间 02:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 运行抓取脚本
      run: |
        # 注意：文件名包含空格和特殊字符，建议用引号括起来
        # 请确保你的文件名与下面完全一致
        python "tvmao_epg_卫视+央视+ 四川+中数传媒+中国教育电视台+CHC华诚付费+北广传媒集团+华数传媒+四川宜宾.py"
        
    - name: 提交更新
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add EPG/
        git commit -m "Auto update EPG data [skip ci]" || echo "No changes to commit"
        git push
